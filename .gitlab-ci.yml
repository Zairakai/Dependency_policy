# The policy is read live from main by the update tools of the group, so main is the only long-lived branch here.
# Each ecosystem has its own update tool: @zairakai/js-dev-tools for node.json and zairakai/laravel-dev-tools for php.json.
# They lift the entries whose condition is met (merge request into main, merged when its pipeline succeeds), and the
# first one checks the shape of both files.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - watch
  - watch-php

variables:
  NODE_IMAGE: "zairakai/node:1.3.1-dev"
  # The jobs of the automatic updates sign with gpg: the dev image has it since 2.3.0.
  PHP_IMAGE: "zairakai/php:2.3.0-dev"
  GIT_DEPTH: 1

.tool: &tool
  image: ${NODE_IMAGE}
  before_script:
    - npm install --no-save --no-audit --no-fund "@zairakai/js-dev-tools@latest"

# Every change of the policy is checked before it is read by the tools.
policy:validate:
  <<: *tool
  stage: validate
  script:
    - node node_modules/@zairakai/js-dev-tools/scripts/update-dependencies.mjs policy-validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

# A daily schedule lifts the entries of node.json whose condition is met. The group variable GITLAB_TOKEN (protected, so
# this runs on main) opens and merges the merge request, NTFY_URL is the alert.
policy:watch:node:
  <<: *tool
  stage: watch
  script:
    - node node_modules/@zairakai/js-dev-tools/scripts/update-dependencies.mjs policy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The same for php.json, after the job above (a merge request that lifts an entry stops the next one).
policy:watch:php:
  image: ${PHP_IMAGE}
  stage: watch-php
  before_script:
    - composer create-project --no-interaction --no-progress zairakai/laravel-dev-tools /tmp/laravel-dev-tools
  script:
    - php /tmp/laravel-dev-tools/bin/update-dependencies policy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
